<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifremi Unuttum</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #121214; color: #e4e4e7; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 20px; }
    .card { background-color: #1c1c21; border: 1px solid #2d2d35; border-radius: 6px; padding: 32px; width: 100%; max-width: 400px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; color: #ffffff; }
    .subtitle { font-size: 0.875rem; color: #a1a1aa; text-align: center; margin-bottom: 24px; line-height: 1.4; }
    .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
    label { font-size: 0.875rem; margin-bottom: 6px; color: #d4d4d8; }
    input { background-color: #0f0f12; border: 1px solid #3f3f46; border-radius: 4px; padding: 10px 12px; color: #ffffff; font-size: 0.95rem; outline: none; transition: border-color 0.2s; width: 100%; }
    input:focus { border-color: #8b5cf6; }
    input.error { border-color: #ef4444; }
    .error-msg { color: #ef4444; font-size: 0.75rem; margin-top: 4px; display: none; }
    .btn { background-color: #7c3aed; color: #ffffff; border: none; border-radius: 4px; padding: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; transition: box-shadow 0.2s, background-color 0.2s; }
    .btn:hover { background-color: #8b5cf6; box-shadow: 0 0 12px rgba(139, 92, 246, 0.4); }
    .links { margin-top: 20px; text-align: center; font-size: 0.875rem; }
    a { color: #a78bfa; text-decoration: none; transition: color 0.2s; }
    a:hover { text-decoration: underline; }
    .success-msg { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; color: #4ade80; padding: 10px; border-radius: 4px; font-size: 0.875rem; text-align: center; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Şifremi Unuttum</h1>
    <p class="subtitle">E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>
    <div id="successMsg" class="success-msg"></div>
    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label for="email">E-posta Adresi</label>
        <input type="email" id="email" name="email" placeholder="ornek@email.com">
        <div class="error-msg"></div>
      </div>
      <button type="submit" class="btn">Şifre Sıfırlama Bağlantısı Gönder</button>
    </form>
    <div class="links">
      <a href="index.html">Giriş sayfasına dön</a>
    </div>
  </div>
  <script>
    function showError(input, message) {
      input.classList.add('error');
      const errorEl = input.closest('.form-group').querySelector('.error-msg');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function clearError(input) {
      input.classList.remove('error');
      const errorEl = input.closest('.form-group').querySelector('.error-msg');
      if (errorEl) errorEl.style.display = 'none';
    }

    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', () => clearError(input));
    });

    document.getElementById('forgotForm').addEventListener('submit', function(e) {
      e.preventDefault();
      let isValid = true;
      const email = document.getElementById('email');
      const successMsg = document.getElementById('successMsg');

      if (!email.value.trim()) {
        showError(email, 'E-posta adresi boş bırakılamaz.');
        isValid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
        showError(email, 'Geçerli bir e-posta adresi giriniz.');
        isValid = false;
      } else {
        clearError(email);
      }

      if (isValid) {
        successMsg.style.display = 'block';
        successMsg.textContent = 'Şifre sıfırlama bağlantısı e-posta adresinize gönderildi.';
      } else {
        successMsg.style.display = 'none';
      }
    });
  </script>
</body>
</html>
